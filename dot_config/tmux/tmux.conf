#=== TMUX SETTINGS =====================================================================
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded config"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
set -g set-clipboard on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:RGB"
set -g status-interval 5
set -g status-position top
if-shell 'test -n "$SSH_CONNECTION"' 'set -g status-position bottom'

set -g status-left "[#S] #{?client_prefix,#[reverse] PREFIX ,}#{?pane_in_mode,#[reverse] COPY ,}"
set -g status-right-length 100
set -g status-right "#[bold]#{s|^#{HOME}|~|:pane_current_path}#(git -C #{pane_current_path} branch --show-current 2>/dev/null | sed 's/.*/ @&/') "
set -g window-status-format " #I:#W"
set -g window-status-current-format "#[reverse] #I:#W#{?window_zoomed_flag, (zoomed)} "
set -g pane-border-lines heavy
set -g pane-border-indicators both

#=== PLUGINS ===========================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

if "test ! -d ~/.config/tmux/plugins/tpm" \
"run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Keep at the bottom so continuum can hook into status-right
run '~/.config/tmux/plugins/tpm/tpm'
